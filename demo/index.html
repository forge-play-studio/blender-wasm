<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blender</title>
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!--
      Loading page. This build is embedded in an editor panel and launched for
      the person, so it is a progress readout, not a landing page: no branding,
      no marketing copy, nothing to click. Every id below is part of the
      loader's contract (src/main.js drives them by id and by [data-phase]) —
      keep them even when they are not shown.
    -->
    <section id="splash" aria-live="polite">
      <main class="stage" data-phase="loading">
        <div id="splash-shell" class="stage-inner" data-phase="loading">
          <div id="stage-card" class="launch-panel" data-phase="loading">
            <div class="panel-loading" aria-label="Loading Blender">
              <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <div class="progress-meta">
                <span id="progress-phase">Preparing</span>
                <span id="progress-percent"></span>
              </div>
              <p id="splash-status" class="splash-status">Starting Blender…</p>
            </div>

            <!-- The panel clicks this itself; kept because main.js binds to it. -->
            <div class="panel-ready" aria-label="Launch">
              <button id="start-btn" type="button" class="start-btn">Start</button>
              <p id="webgpu-note" class="jspi-note" hidden></p>
            </div>

            <div id="gpu-warning" class="gpu-warning" hidden>
              <p id="gpu-warning-text" class="gpu-warning-text"></p>
              <label id="gpu-ack-row" class="gpu-ack-row" hidden>
                <input type="checkbox" id="gpu-ack" />
                <span>Continue anyway</span>
              </label>
            </div>
          </div>

          <!-- Diagnostics. Hidden until the loader switches to the console phase. -->
          <section class="startup-console" aria-label="Startup console">
            <p class="phase-kicker">Startup log</p>
            <div id="console-output" class="console-box" role="log" aria-label="Startup console output"></div>
          </section>
        </div>
      </main>
    </section>
    <canvas id="canvas" width="1536" height="864" tabindex="0"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
